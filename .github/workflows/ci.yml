name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug when platform exists
        run: |
          if [ -d android ]; then
            flutter build apk --debug
          else
            echo "Android platform folder not generated yet; skipping debug APK build."
          fi
