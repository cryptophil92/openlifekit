name: open_life_kit
description: Privacy-first offline-first life and emergency essentials kit for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.22.1
  sqlite3: ^2.4.7
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.22.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
