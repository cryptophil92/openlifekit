name: open_life_kit
description: Privacy-first, offline-first life and emergency essentials kit for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  drift: ^2.34.0
  sqlite3: ^3.3.4
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.34.1+1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
